name: Android CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: true
        persist-credentials: false

    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Test core invariants
      run: ./gradlew testDebugUnitTest --tests 'io.github.nexalloy.morphe.CoreInvariantTest'

    - name: Lint
      run: ./gradlew lintDebug

    - name: Build Debug
      run: ./gradlew assembleDebug

    - name: Upload Debug Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nexalloy-ci-debug-apk
        path: app/build/outputs/apk/debug

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: true
        persist-credentials: false

    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write key
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        KEYSTORE: ${{ secrets.KEYSTORE }}
      run: |
        printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" > signing.properties
        printf 'KEYSTORE_ALIAS=%s\n' "$KEYSTORE_ALIAS" >> signing.properties
        printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$KEYSTORE_ALIAS_PASSWORD" >> signing.properties
        printf 'KEYSTORE_FILE=../key.jks\n' >> signing.properties
        printf '%s' "$KEYSTORE" | base64 --decode > key.jks

    - name: Build Release
      run: ./gradlew assembleRelease

    - name: Upload Release Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nexalloy-ci-release-apk
        path: |
          app/build/outputs/apk/release
          app/build/outputs/mapping/release/mapping.txt

    - name: Create AutoBuild Release
      run: |
        LATEST_REL=$(gh release view --json tagName -q .tagName)
        GIT_DESCRIBE=$(git rev-parse --short HEAD)
        cd app/build/outputs/apk/release/
        mv app-release.apk "NexAlloy-${GIT_DESCRIBE}.apk"
        gh release delete autobuild --cleanup-tag --yes || true
        gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/autobuild" >/dev/null 2>&1 || true
        gh release create autobuild "NexAlloy-${GIT_DESCRIBE}.apk" \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "Nightly Build ${GIT_DESCRIBE}" \
          --notes "Nightly build from commit ${GIT_DESCRIBE}. See changes: https://github.com/${{ github.repository }}/compare/${LATEST_REL}...main"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
