name: Android Release CI

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        persist-credentials: false

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write key
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        KEYSTORE: ${{ secrets.KEYSTORE }}
      run: |
        printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" > signing.properties
        printf 'KEYSTORE_ALIAS=%s\n' "$KEYSTORE_ALIAS" >> signing.properties
        printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$KEYSTORE_ALIAS_PASSWORD" >> signing.properties
        printf 'KEYSTORE_FILE=../key.jks\n' >> signing.properties
        printf '%s' "$KEYSTORE" | base64 --decode > key.jks

    - name: Build Release
      run: ./gradlew assembleRelease

    - run: |
        cd app/build/outputs/apk/release/
        mv app-release.apk "NexAlloy-${{ github.ref_name }}.apk"
        gh release create "${{ github.ref_name }}" "NexAlloy-${{ github.ref_name }}.apk"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
